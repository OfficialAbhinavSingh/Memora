name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  context-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/context-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/context-api/go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/context-api
