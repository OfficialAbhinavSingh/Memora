image:
  repository: memora/context-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

replicaCount: 1

env:
  PCE_ADDR: ":8080"
  PCE_API_KEY: ""
  PCE_FAST_WINDOW: "30m"
  PCE_DEEP_WINDOW: "4h"
  PCE_SIMILARITY_LOOKBACK: "720h"
  PCE_READ_TIMEOUT: "5s"
  PCE_WRITE_TIMEOUT: "10s"
  PCE_SHUTDOWN_TIMEOUT: "15s"
  PCE_MAX_REQUEST_BYTES: "4194304"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
