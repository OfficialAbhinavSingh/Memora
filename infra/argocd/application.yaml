apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pce-context-api
spec:
  project: default
  source:
    repoURL: https://example.invalid/memora/pce.git
    targetRevision: main
    path: deploy/helm/pce
  destination:
    server: https://kubernetes.default.svc
    namespace: pce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
