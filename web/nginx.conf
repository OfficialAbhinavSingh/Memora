# Persistent Context Engine — Nginx reverse proxy
#
# Deployment model: SAME-DOMAIN (no CORS needed)
#
# Nginx is the single entry point:
#   https://pce.internal/       → serves web/dist/ (React SPA)
#   https://pce.internal/v1/*   → proxies to context-api:8080
#
# Because the browser never makes a cross-origin request, PCE_ALLOWED_ORIGINS
# can be left empty and the Go CORS middleware is disabled.

server {
    listen 80;
    server_name _;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"            always;
    add_header Referrer-Policy         "no-referrer"     always;

    # --- API proxy ---
    # All /v1/* requests are forwarded to the Go backend.
    location /v1/ {
        proxy_pass         http://context-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;

        # Strip the Nginx-internal X-Accel headers from upstream responses
        proxy_hide_header X-Accel-Redirect;
    }

    # --- React SPA ---
    # Serve static build output. All routes that don't map to a file fall
    # through to index.html so client-side routing works correctly.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Immutable cache for hashed assets (Vite stamps filenames with hash)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # index.html must not be cached (contains the SPA entrypoint)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
